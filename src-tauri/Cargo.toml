[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2"

# The whole (multi-language) frontend is embedded into this crate by Tauri, so
# its codegen is very memory-heavy and can make rustc/LLVM run out of memory
# (notably on Windows). Compile this crate cheaply — its own code is trivial and
# the embedded assets are just data — while keeping release optimizations for
# the dependency crates. This drastically lowers peak compile memory.
[profile.release.package.app]
opt-level = 0
codegen-units = 256

[profile.release.build-override]
opt-level = 0
